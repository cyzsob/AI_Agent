[project]
name = "my-rag-demo"
version = "1.0.0"
description = "DeepSeek RAG Agent — 混合检索知识库问答系统（支持 MCP 外部工具）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sse-starlette>=2.0",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langchain-postgres>=0.0.12",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.0",
    "mcp>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "rapidocr>=2.0",
    "python-docx>=1.1",
]

[tool.setuptools]
# 源码位于 app/ 目录，直接以脚本方式运行（python app/server_agui.py），不安装为包
packages = []
